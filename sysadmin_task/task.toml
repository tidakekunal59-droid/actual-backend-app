schema_version = "1.1"

[task]
name        = "sysadmin/full-server-setup"
description = "A comprehensive system administration task setting up Nginx, a custom vhost, UFW, a sudo user, a systemd service, and a cron job."
authors     = [{ name = "System Administrator", email = "admin@example.com" }]
author_name = "Chitra"
author_email = "novazeus12@gmail.com"
tags        = ["sysadmin", "linux", "nginx", "ufw", "systemd", "cron"]
keywords    = ["sysadmin", "linux", "nginx", "ufw", "systemd", "cron"]

[metadata]
difficulty = "intermediate"
difficulty_explanation = "Requires intermediate to advanced Linux system administration skills."
solution_explanation = "The solution script automates standard Linux command-line tools to configure Nginx, UFW, user management, and systemd services system-wide."
verification_explanation = "The verifier relies on bash tools (systemctl, dpkg, ufw, crontab, curl) to assert that each component is correctly configured."
expert_time_estimate_hours = 0.5
category              = "administration"

[verifier]
timeout_sec = 180.0
user        = "root"

[agent]
timeout_sec = 600.0
user        = "root"

[solution]
env = {}

[environment]
build_timeout_sec = 600.0
docker_image      = "sysadmin-task-env:latest"
os               = "linux"
cpus             = 2
memory_mb        = 2048
storage_mb       = 10240
gpus             = 0
allow_internet   = true
env              = {}
