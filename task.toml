schema_version = "1.1"

[task]
name        = "firebase/backend-bug"
description = "Fix a bug in the Firebase application backend"
authors     = [{ name = "Admin", email = "admin@example.com" }]
keywords    = ["backend", "firebase", "nodejs"]

[metadata]
difficulty_explanation = "Requires understanding of Firebase functions and Node.js"
category              = "programming"

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 300.0
user        = "root"

[environment]
build_timeout_sec = 600.0
docker_image      = "node:18"
os               = "linux"
cpus             = 2
memory_mb        = 4096
storage_mb       = 10240
gpus             = 0
allow_internet   = true
